<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b20">
  <title>Jungle Adventure | AniX Creations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="game-header">
      <div class="brand">AniX <span>Creations</span></div>
      <h1>JUNGLE ADVENTURE</h1>
      <p>Explore the jungle, leap across the platforms and collect gems!</p>
    </header>

    <section class="game-shell" aria-label="Jungle Adventure game">
      <div id="game-container"></div>
      <div class="control-hint">
        <span><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> Move</span>
        <span><kbd>SPACE</kbd> / <kbd>↑</kbd> / <kbd>W</kbd> Jump</span>
      </div>
    </section>

    <footer>First playable build · Made with Phaser 3</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
